version: '3.9'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: schoolos-prod-postgres
    restart: always
    environment:
      POSTGRES_DB: schoolos
      POSTGRES_USER: schoolos_admin
      POSTGRES_PASSWORD: ${POSTGRES_PROD_PASSWORD:-schoolos_prod_secure_vault_2026}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c maintenance_work_mem=256MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=16MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command='test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - pgwal_prod:/var/lib/postgresql/wal_archive
      - ./deploy/postgres/01-init-role.sh:/docker-entrypoint-initdb.d/01-init-role.sh:ro
      - ./docs/DATABASE_SCHEMA.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
      - ./deploy/postgres/03-grant-permissions.sql:/docker-entrypoint-initdb.d/03-grant-permissions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolos_admin -d schoolos"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - schoolos-prod-net

  redis:
    image: redis:7-alpine
    container_name: schoolos-prod-redis
    restart: always
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - schoolos-prod-net

  minio:
    image: minio/minio:latest
    container_name: schoolos-prod-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-schoolos_storage_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-schoolos_s3_storage_secret_key_2026}
    volumes:
      - miniodata_prod:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - schoolos-prod-net

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: schoolos-prod-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://schoolos_app:schoolos_app_secret@postgres:5432/schoolos?sslmode=disable"
      DATABASE_SUPERUSER_URL: "postgres://schoolos_admin:${POSTGRES_PROD_PASSWORD:-schoolos_prod_secure_vault_2026}@postgres:5432/schoolos?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      JWT_SECRET: ${JWT_SECRET:-schoolos_prod_jwt_super_secret_signing_key_64bytes_production}
      ENV: "production"
    expose:
      - "8080"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - schoolos-prod-net

  telemetry:
    build:
      context: .
      dockerfile: services/telemetry/Dockerfile
    container_name: schoolos-prod-telemetry
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TCP_PORT: "5023"
      DATABASE_URL: "postgres://schoolos_app:schoolos_app_secret@postgres:5432/schoolos?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      ENV: "production"
    expose:
      - "5023"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - schoolos-prod-net

  nginx:
    image: nginx:1.27-alpine
    container_name: schoolos-prod-nginx
    restart: always
    depends_on:
      - api
      - telemetry
    ports:
      - "80:80"
      - "443:443"
      - "5023:5023"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/schoolos.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - schoolos-prod-net

volumes:
  pgdata_prod:
  pgwal_prod:
  redisdata_prod:
  miniodata_prod:

networks:
  schoolos-prod-net:
    driver: bridge
